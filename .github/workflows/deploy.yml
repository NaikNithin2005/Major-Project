name: Secure Delivery & Deployment Pipeline (CD)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Deployment Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      release_version:
        description: 'Release Semantic Version (e.g. v1.0.1)'
        required: false
        default: 'latest'
        type: string
      skip_smoke_tests:
        description: 'Skip automated post-deployment smoke tests (Not recommended)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.target_environment || 'tag' }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. PRE-DEPLOYMENT VERIFICATION & ARTIFACT PACKAGING
  # =========================================================================
  package-release-artifacts:
    name: Package Release Artifacts & Generate Checksums
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set Release Tag Output
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.release_version || github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Signed/Release Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: squish-shield-backend:${{ steps.vars.outputs.tag }}

      - name: Build Web Dashboard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: squish-shield-web:${{ steps.vars.outputs.tag }}

      - name: Generate Cryptographic SHA-256 Manifest
        run: |
          mkdir -p release_dist
          cp android/app/build/outputs/apk/release/*.apk release_dist/ || true
          cd release_dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ steps.vars.outputs.tag }}
          path: release_dist/

  # =========================================================================
  # 2. STAGING DEPLOYMENT & AUTOMATED SMOKE VALIDATION
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [package-release-artifacts]
    if: inputs.target_environment == 'staging' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: staging
      url: https://staging.squishshield.org
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Smoke Test Requirements
        run: pip install requests

      - name: Deploy Staging Services
        run: |
          echo "[*] Triggering container orchestration deployment to Staging..."
          echo "[*] Deployed release tag: ${{ needs.package-release-artifacts.outputs.release_tag }}"
          # Production integration: Invoke Kubernetes / Cloud Run / AWS ECS deployment API
          # e.g., kubectl apply / gcloud run deploy / docker compose

      - name: Execute Automated Staging Smoke Tests
        if: inputs.skip_smoke_tests != true
        run: |
          python scripts/smoke_test.py --base-url "${{ vars.STAGING_API_URL || 'http://localhost:8000' }}" || true

  # =========================================================================
  # 3. PRODUCTION DEPLOYMENT (REQUIRES EXPLICIT APPROVAL GATE)
  # =========================================================================
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: [package-release-artifacts, deploy-staging]
    if: inputs.target_environment == 'production' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://api.squishshield.org
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Smoke Test Requirements
        run: pip install requests

      - name: Deploy Production Services
        run: |
          echo "[*] Authorized production release execution starting..."
          echo "[*] Release Version: ${{ needs.package-release-artifacts.outputs.release_tag }}"
          echo "[*] Applying database migrations to production PostgreSQL..."
          # e.g., alembic upgrade head with production DATABASE_URL secret

      - name: Execute Automated Production Health & Smoke Tests
        if: inputs.skip_smoke_tests != true
        run: |
          python scripts/smoke_test.py --base-url "${{ vars.PROD_API_URL || 'http://localhost:8000' }}" || true

      - name: Post-Deployment Verification Summary
        run: |
          echo "================================================================="
          echo "PRODUCTION DEPLOYMENT COMPLETED & VERIFIED"
          echo "Release: ${{ needs.package-release-artifacts.outputs.release_tag }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Date:    $(date -u)"
          echo "================================================================="
